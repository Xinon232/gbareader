name: Delete all releases (one-time)

# Manual, one-time cleanup: deletes every GitHub release and its files.
# Git tags are kept. Remove this workflow after it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          for id in $(gh api --paginate "repos/$R/releases?per_page=100" --jq '.[].id'); do
            gh api -X DELETE "repos/$R/releases/$id"
            echo "deleted release $id"
          done
          test "$(gh api "repos/$R/releases" --jq length)" = 0
