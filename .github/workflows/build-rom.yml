name: Build GBA ROM

on:
  push:
    branches:
      - main
      - release/v0.8.0
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Optional: numeric ID of a draft release to fill and publish (empty with a tag: create the draft)'
        required: false
        default: ''
      tag:
        description: 'Tag the release creates on this commit; set it to publish'
        required: false
        default: ''
      name:
        description: 'Release title when the workflow creates the draft (default: the tag)'
        required: false
        default: ''
      prerelease:
        description: 'Publish the gbareader release as a pre-release (not marked latest)'
        type: boolean
        required: false
        default: false
      gbawriter_ref:
        description: 'Optional: build this Xinon232/gbawriter commit instead and publish it here as a pre-release (needs a tag)'
        required: false
        default: ''
      gbavocab_ref:
        description: 'Optional: build this Xinon232/gbavocab commit instead and publish it here as a pre-release (needs a tag)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.gbawriter_ref && !inputs.gbavocab_ref }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out GBAReader
        uses: actions/checkout@v4
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Run host tests with sanitizers
        env:
          EXTRA_CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: bash tests/run_host_tests.sh
      - name: Install FAT image test tools
        run: apt-get update && apt-get install -y --no-install-recommends dosfstools mtools
      - name: Test real FatFS transient-error recovery
        run: python3 tests/fatfs/run.py
      - name: Test legacy EPUB migration recovery
        env:
          GBAREADER_FATFS_FIXTURE: legacy-v047.epub
        run: python3 tests/fatfs/run.py
      - name: Test fast cached open on a 303-entry EPUB
        env:
          GBAREADER_FATFS_FIXTURE: many-entries.epub
        run: python3 tests/fatfs/run.py
      - name: Build complete ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - name: Build demo ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 DEMO=1 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - name: Verify ROMs exist
        run: test -s gbareader.gba && test -s demo_gbareader.gba
      - name: Upload complete ROM
        uses: actions/upload-artifact@v4
        with:
          name: GBAReader-${{ github.sha }}
          path: gbareader.gba
          if-no-files-found: error
      - name: Upload demo ROM
        uses: actions/upload-artifact@v4
        with:
          name: GBAReader-demo-${{ github.sha }}
          path: demo_gbareader.gba
          if-no-files-found: error

  # Manual only: attach this exact build and the controls manual to a draft release
  # (created here when no release_id is given), add checksums, create the tag on this
  # commit and publish it as the latest release.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && !inputs.gbawriter_ref && !inputs.gbavocab_ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out GBAReader
        uses: actions/checkout@v4
      - name: Download tested ROM
        uses: actions/download-artifact@v4
        with:
          name: GBAReader-${{ github.sha }}
          path: dist
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          if [ "$PRERELEASE" = true ]; then LATEST=false; else LATEST=true; fi
          if [ -z "$RELEASE_ID" ]; then
            if gh api "repos/$R/releases/tags/$TAG" > /dev/null 2>&1; then
              echo "A release for $TAG already exists" >&2; exit 1
            fi
            RELEASE_ID=$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" -f name="${NAME:-$TAG}" -F draft=true --jq '.id')
          fi
          cp docs/gbareader-full-controls.pdf docs/gbareader-full-controls.md dist/
          cd dist
          test -s gbareader.gba
          sha256sum gbareader-full-controls.md gbareader-full-controls.pdf gbareader.gba > SHA256SUMS
          {
            cat ../RELEASE_NOTES.md
            printf '\nSource/tag: `%s` (`%s`). The ROM is the GitHub Actions build of this exact commit ([run](%s)), which also ran the host, sanitizer and FatFS test steps.\n\n```text\n' "$GITHUB_SHA" "$TAG" "$RUN_URL"
            cat SHA256SUMS
            printf '```\n'
          } > body.md
          for name in gbareader.gba gbareader-full-controls.pdf gbareader-full-controls.md SHA256SUMS; do
            for id in $(gh api "repos/$R/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$R/releases/assets/$id"
            done
            gh api -X POST "https://uploads.github.com/repos/$R/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$name" > /dev/null
          done
          gh api -X PATCH "repos/$R/releases/$RELEASE_ID" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -F body=@body.md -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$LATEST" --jq '.html_url'

  # Manual only: gbawriter is kept in this repo's releases until it moves to its
  # own. Runs gbawriter's own host tests, FatFS image tests, ROM build and
  # memory gate on the given commit.
  gbawriter:
    if: github.event_name == 'workflow_dispatch' && inputs.gbawriter_ref != ''
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out GBA Writer
        uses: actions/checkout@v4
        with:
          repository: Xinon232/gbawriter
          ref: ${{ inputs.gbawriter_ref }}
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Install FAT image test tools
        run: apt-get update && apt-get install -y --no-install-recommends dosfstools
      - name: Test actual FatFS and interrupted-save recovery
        run: python3 tests/run_fatfs_tests.py
      - name: Build complete ROM and check memory
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
          make memory-check LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
          test -s gbawriter.gba
      - name: Record the built commit
        env:
          REF: ${{ inputs.gbawriter_ref }}
        run: printf '%s\n' "$REF" > gbawriter-commit.txt
      - name: Upload tested ROM and notes
        uses: actions/upload-artifact@v4
        with:
          name: gbawriter-${{ github.run_id }}
          path: |
            gbawriter.gba
            gbawriter-full-controls.pdf
            RELEASE_NOTES.md
            gbawriter-commit.txt
          if-no-files-found: error

  gbawriter-publish:
    needs: gbawriter
    if: github.event_name == 'workflow_dispatch' && inputs.gbawriter_ref != '' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested ROM
        uses: actions/download-artifact@v4
        with:
          name: gbawriter-${{ github.run_id }}
          path: dist
      - name: Publish pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          if gh api "repos/$R/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists" >&2; exit 1
          fi
          cd dist
          test -s gbawriter.gba
          COMMIT=$(cat gbawriter-commit.txt)
          sha256sum gbawriter.gba gbawriter-full-controls.pdf > SHA256SUMS
          {
            sed '/^## Previous release notes/,$d' RELEASE_NOTES.md
            printf '\nBuilt from [Xinon232/gbawriter@%s](https://github.com/Xinon232/gbawriter/commit/%s) by this repository'"'"'s workflow ([run](%s)), which also ran gbawriter'"'"'s host, FatFS image and memory checks. Published here as a pre-release until gbawriter gets its own releases.\n\n```text\n' "$COMMIT" "$COMMIT" "$RUN_URL"
            cat SHA256SUMS
            printf '```\n'
          } > body.md
          ID=$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="${NAME:-$TAG}" -F draft=true -F prerelease=true -f make_latest=false --jq '.id')
          for name in gbawriter.gba gbawriter-full-controls.pdf SHA256SUMS; do
            gh api -X POST "https://uploads.github.com/repos/$R/releases/$ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$name" > /dev/null
          done
          gh api -X PATCH "repos/$R/releases/$ID" -F body=@body.md -F draft=false -F prerelease=true \
            -f make_latest=false --jq '.html_url'

  # Manual only: gbavocab, like gbawriter above, until it publishes from its own
  # repository. Mirrors gbavocab's CI: host and sanitized dictionary suites, then
  # the ROM build.
  gbavocab-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.gbavocab_ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out gbavocab
        uses: actions/checkout@v4
        with:
          repository: Xinon232/gbavocab
          ref: ${{ inputs.gbavocab_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host test dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Run host correctness suite
        run: bash tests/run_host_tests.sh --correctness-only
      - name: Run dictionary suites with sanitizers
        run: bash tests/run_dictionary_tests.sh --sanitize

  gbavocab:
    needs: gbavocab-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out gbavocab
        uses: actions/checkout@v4
        with:
          repository: Xinon232/gbavocab
          ref: ${{ inputs.gbavocab_ref }}
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Build complete ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
          test -s gbavocab.gba
      - name: Collect ROM, manual and release notes
        env:
          REF: ${{ inputs.gbavocab_ref }}
        run: |
          set -eu
          mkdir -p out
          cp gbavocab.gba docs/gbavocab-full-controls.pdf out/
          cp "docs/release-$(cat VERSION).md" out/RELEASE_NOTES.md
          printf '%s\n' "$REF" > out/gbavocab-commit.txt
      - name: Upload tested ROM and notes
        uses: actions/upload-artifact@v4
        with:
          name: gbavocab-${{ github.run_id }}
          path: out
          if-no-files-found: error

  gbavocab-publish:
    needs: gbavocab
    if: github.event_name == 'workflow_dispatch' && inputs.gbavocab_ref != '' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested ROM
        uses: actions/download-artifact@v4
        with:
          name: gbavocab-${{ github.run_id }}
          path: dist
      - name: Publish pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          if gh api "repos/$R/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists" >&2; exit 1
          fi
          cd dist
          test -s gbavocab.gba
          COMMIT=$(cat gbavocab-commit.txt)
          sha256sum gbavocab.gba gbavocab-full-controls.pdf > SHA256SUMS
          {
            cat RELEASE_NOTES.md
            printf '\nBuilt from [Xinon232/gbavocab@%s](https://github.com/Xinon232/gbavocab/commit/%s) by this repository'"'"'s workflow ([run](%s)), which also ran gbavocab'"'"'s host and sanitized dictionary suites. Published here as a pre-release until gbavocab publishes it itself.\n\n```text\n' "$COMMIT" "$COMMIT" "$RUN_URL"
            cat SHA256SUMS
            printf '```\n'
          } > body.md
          ID=$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="${NAME:-$TAG}" -F draft=true -F prerelease=true -f make_latest=false --jq '.id')
          for name in gbavocab.gba gbavocab-full-controls.pdf SHA256SUMS; do
            gh api -X POST "https://uploads.github.com/repos/$R/releases/$ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$name" > /dev/null
          done
          gh api -X PATCH "repos/$R/releases/$ID" -F body=@body.md -F draft=false -F prerelease=true \
            -f make_latest=false --jq '.html_url'
