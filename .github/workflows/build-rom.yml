name: Build GBA ROM

on:
  push:
    branches:
      - main
      - release/v0.8.0
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Optional: numeric ID of a draft release to fill and publish (empty with a tag: create the draft)'
        required: false
        default: ''
      tag:
        description: 'Tag the release creates on this commit; set it to publish'
        required: false
        default: ''
      name:
        description: 'Release title when the workflow creates the draft (default: the tag)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out GBAReader
        uses: actions/checkout@v4
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Run host tests with sanitizers
        env:
          EXTRA_CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: bash tests/run_host_tests.sh
      - name: Install FAT image test tools
        run: apt-get update && apt-get install -y --no-install-recommends dosfstools mtools
      - name: Test real FatFS transient-error recovery
        run: python3 tests/fatfs/run.py
      - name: Test legacy EPUB migration recovery
        env:
          GBAREADER_FATFS_FIXTURE: legacy-v047.epub
        run: python3 tests/fatfs/run.py
      - name: Build complete ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - name: Verify ROM exists
        run: test -s gbareader.gba
      - name: Upload complete ROM
        uses: actions/upload-artifact@v4
        with:
          name: GBAReader-${{ github.sha }}
          path: gbareader.gba
          if-no-files-found: error

  # Manual only: attach this exact build and the controls manual to a draft release
  # (created here when no release_id is given), add checksums, create the tag on this
  # commit and publish it as the latest release.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out GBAReader
        uses: actions/checkout@v4
      - name: Download tested ROM
        uses: actions/download-artifact@v4
        with:
          name: GBAReader-${{ github.sha }}
          path: dist
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          if [ -z "$RELEASE_ID" ]; then
            if gh api "repos/$R/releases/tags/$TAG" > /dev/null 2>&1; then
              echo "A release for $TAG already exists" >&2; exit 1
            fi
            RELEASE_ID=$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" -f name="${NAME:-$TAG}" -F draft=true --jq '.id')
          fi
          cp docs/gbareader-full-controls.pdf docs/gbareader-full-controls.md dist/
          cd dist
          test -s gbareader.gba
          sha256sum gbareader-full-controls.md gbareader-full-controls.pdf gbareader.gba > SHA256SUMS
          {
            cat ../RELEASE_NOTES.md
            printf '\nSource/tag: `%s` (`%s`). The ROM is the GitHub Actions build of this exact commit ([run](%s)), which also ran the host, sanitizer and FatFS test steps.\n\n```text\n' "$GITHUB_SHA" "$TAG" "$RUN_URL"
            cat SHA256SUMS
            printf '```\n'
          } > body.md
          for name in gbareader.gba gbareader-full-controls.pdf gbareader-full-controls.md SHA256SUMS; do
            for id in $(gh api "repos/$R/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$R/releases/assets/$id"
            done
            gh api -X POST "https://uploads.github.com/repos/$R/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$name" > /dev/null
          done
          gh api -X PATCH "repos/$R/releases/$RELEASE_ID" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -F body=@body.md -F draft=false -f make_latest=true --jq '.html_url'
