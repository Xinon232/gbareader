name: Build GBA ROM

on:
  push:
    branches:
      - release/v0.4.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out GBAReader
        uses: actions/checkout@v4
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Run host tests
        run: bash tests/run_host_tests.sh
      - name: Build complete ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - name: Verify ROM exists
        run: test -s gbareader.gba
      - name: Upload complete ROM
        uses: actions/upload-artifact@v4
        with:
          name: GBAReader-v0.4.7
          path: gbareader.gba
          if-no-files-found: error
